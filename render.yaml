services:
  - type: web
    name: site-cv
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: SMTP_HOST
        value: smtp.mail.yahoo.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: CONTACT_TO
        value: melany.from@yahoo.com
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
